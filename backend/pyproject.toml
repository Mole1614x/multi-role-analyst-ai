[project]
name = "multi-role-analyst-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn[standard]>=0.40,<1",
    "pydantic-settings>=2.12,<3",
    "email-validator>=2.3,<3",
    "python-multipart>=0.0.24,<1",
    "sqlalchemy>=2.0.46,<2.1",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
    "redis>=6.4,<8",
    "celery[redis]>=5.6,<6",
    "langgraph>=1.0,<2",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "argon2-cffi>=25.1,<26",
    "boto3>=1.42,<2",
    "prometheus-client>=0.24,<1",
    "pandas>=2.3,<4",
    "numpy>=2.2,<3",
    "duckdb>=1.5,<2",
    "pyarrow>=20,<30",
    "scipy>=1.15,<2",
    "statsmodels>=0.14.4,<1",
    "scikit-learn>=1.6,<2",
    "plotly>=6,<7",
    "openpyxl>=3.1.5,<4",
    "xlsxwriter>=3.2,<4",
    "matplotlib>=3.10,<4",
    "python-pptx>=1.0.2,<2",
    "sqlglot>=28,<31",
    "langgraph-checkpoint-postgres>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pypdf>=6,<8", "ruff>=0.14,<1", "respx>=0.22,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
